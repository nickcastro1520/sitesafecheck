name: IndexNow
on:
  schedule:
    - cron: "37 14 * * *"   # daily, 14:37 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs
